name: clearcut_mobile
description: A native Android companion to https://clearcutradio.app/

publish_to: 'none'

version: 2.7.0

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.0.0
  audioplayers: ^6.1.0
  collection: ^1.17.0
  shared_preferences: ^2.0.15

  provider: ^6.0.0
  url_launcher: ^6.3.1
  file_picker: 13.2.0
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter_local_notifications: 22.3.3
  clearcut_core:
    path: packages/clearcut_core

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
