name: clearcut_relay
description: Watches Clearcut for calls that match each phone's rules and sends them push notifications.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  args: 2.7.0
  clearcut_core:
    path: ../packages/clearcut_core
  collection: ^1.18.0
  crypto: 3.0.7
  googleapis_auth: 2.3.5
  http: ^1.0.0
  shelf: 1.4.3
  shelf_router: 1.1.5

dev_dependencies:
  lints: 6.1.0
  test: 1.33.0
