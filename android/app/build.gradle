plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Push notifications need a Firebase config, which is kept out of the repo.
// Builds without it work, with notifications turned off. See the README.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// The release signing key is described in android/key.properties, which is
// kept out of the repo along with the key itself. Without it, release builds
// are signed with this machine's debug key. See the README.
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { keyProperties.load(it) }
}

android {
    namespace = "com.aidanlemay.clearcut_mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Needed by flutter_local_notifications.
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId = "com.aidanlemay.clearcut_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keyPropertiesFile.exists()) {
            release {
                storeFile = file(keyProperties["storeFile"])
                storePassword = keyProperties["storePassword"]
                keyAlias = keyProperties["keyAlias"]
                keyPassword = keyProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keyPropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "com.google.android.material:material:1.13.0-alpha07" // Add this line
    // Add other dependencies here if necessary
}

flutter {
    source = "../.."
}
